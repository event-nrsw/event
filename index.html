<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#142b4a">
    <title>エントリーシステム</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #142b4a;
            --blue: #3478f6;
            --text: #243247;
            --subtext: #748196;
            --border: #e7edf5;
            --background: #f3f6fb;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family:
                "Yu Gothic UI", "Yu Gothic", "Meiryo",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    circle at top right,
                    #e1ebff 0,
                    transparent 35%
                ),
                var(--background);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 34px;
            background: #ffffff;
            border: 1px solid rgba(225, 232, 243, 0.9);
            border-radius: 24px;
            box-shadow: 0 16px 45px rgba(28, 52, 87, 0.09);
        }

        .header {
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 15px;
            color: #ffffff;
            background: linear-gradient(135deg, #3478f6, #2354bd);
            box-shadow: 0 6px 14px rgba(52, 120, 246, 0.22);
        }

        .brand-icon svg {
            width: 27px;
            height: 27px;
        }

        .brand-name {
            margin: 0;
            color: var(--navy);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .brand-caption {
            margin-top: 4px;
            color: var(--subtext);
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--navy);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }

        .description {
            margin: 0;
            color: var(--subtext);
            font-size: 14px;
            line-height: 1.8;
        }

        .menu-label {
            margin: 0 0 12px;
            color: #8a96a8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-button {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 82px;
            padding: 15px 16px;
            color: var(--text);
            text-decoration: none;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            border-color: #b9d0ff;
            background: #fbfdff;
            box-shadow: 0 8px 20px rgba(37, 82, 145, 0.08);
        }

        .menu-button:active {
            transform: scale(0.985);
        }

        .menu-button:focus-visible {
            outline: 3px solid rgba(52, 120, 246, 0.4);
            outline-offset: 3px;
        }

        .menu-icon {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--blue);
            background: #edf4ff;
            border-radius: 13px;
        }

        .menu-icon svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-content {
            flex: 1;
            min-width: 0;
        }

        .menu-number {
            display: block;
            margin-bottom: 4px;
            color: #8c9ab0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .menu-title {
            display: block;
            color: var(--navy);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .arrow {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #7d91b0;
            background: #f5f7fb;
            border-radius: 50%;
            transition:
                color 0.18s ease,
                background 0.18s ease,
                transform 0.18s ease;
        }

        .arrow svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-button:hover .arrow {
            color: #ffffff;
            background: var(--blue);
            transform: translateX(2px);
        }

        .footer {
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid #edf0f5;
            color: #9aa5b5;
            font-size: 11px;
            text-align: center;
            line-height: 1.7;
        }

        /* スマートフォン対応 */
        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 20px 14px;
            }

            .container {
                max-width: 100%;
                padding: 25px 18px;
                border-radius: 20px;
            }

            .header {
                margin-bottom: 25px;
            }

            .brand {
                margin-bottom: 22px;
            }

            .brand-icon {
                width: 44px;
                height: 44px;
            }

            h1 {
                font-size: 24px;
            }

            .description {
                font-size: 13px;
            }

            .menu-button {
                min-height: 76px;
                gap: 11px;
                padding: 13px 12px;
                border-radius: 14px;
            }

            .menu-icon {
                width: 42px;
                height: 42px;
                border-radius: 12px;
            }

            .menu-title {
                font-size: 14px;
            }

            .arrow {
                width: 27px;
                height: 27px;
            }
        }

        /* 動きを抑える設定が有効な端末への配慮 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="header">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <rect x="4" y="3" width="16" height="18"
                              rx="3"></rect>
                        <path d="M8 8h8"></path>
                        <path d="M8 12h4"></path>
                        <path d="m8 16 2 2 5-5"></path>
                    </svg>
                </div>

                <div>
                    <p class="brand-name">EVENT MANAGEMENT</p>
                    <div class="brand-caption">
                        ナリサワ様イベント運営ポータル
                    </div>
                </div>
            </div>

            <h1>システム登録一覧</h1>

            <p class="description">
                閲覧するメニューを選択してください。
            </p>
        </header>

        <p class="menu-label">MENU　/　ページリスト</p>

        <nav class="menu-list" aria-label="メインメニュー">

            <!-- 1. エントリー -->
            <a class="menu-button"
               href="https://event-nrsw.github.io/event/entry.html">

                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2"></path>
                        <path d="M19 8h4"></path>
                        <path d="M21 6v4"></path>
                    </svg>
                </span>

                <span class="menu-content">
                    <span class="menu-number">MENU 01</span>
                    <span class="menu-title">エントリーページ</span>
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </span>
            </a>

            <!-- 2. エントリーメンテナンス -->
            <a class="menu-button"
               href="https://event-nrsw.github.io/event/setting.html">

                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path>
                        <path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.8 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.8-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.8 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z"
                              transform="translate(-2 -2)"></path>
                    </svg>
                </span>

                <span class="menu-content">
                    <span class="menu-number">MENU 02</span>
                    <span class="menu-title">エントリーメンテナンスページ</span>
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </span>
            </a>

            <!-- 3. コミュニケーション登録 -->
            <a class="menu-button"
               href="https://event-nrsw.github.io/event/talk.html">

                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"></path>
                    </svg>
                </span>

                <span class="menu-content">
                    <span class="menu-number">MENU 03</span>
                    <span class="menu-title">コミュニケーション登録ページ</span>
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </span>
            </a>

            <!-- 4. アンケート登録 -->
            <a class="menu-button"
               href="https://event-nrsw.github.io/event/question.html">

                <span class="menu-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 4H5a2 2 0 0 0-2 2v14h18V6a2 2 0 0 0-2-2h-4"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1"></rect>
                        <path d="m7 12 2 2 4-4"></path>
                        <path d="M15 13h3"></path>
                        <path d="M7 17h11"></path>
                    </svg>
                </span>

                <span class="menu-content">
                    <span class="menu-number">MENU 04</span>
                    <span class="menu-title">アンケート登録ページ</span>
                </span>

                <span class="arrow" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="m9 18 6-6-6-6"></path>
                    </svg>
                </span>
            </a>

        </nav>

        <footer class="footer">
            イベント運営システム
        </footer>

    </main>
</body>
</html>
